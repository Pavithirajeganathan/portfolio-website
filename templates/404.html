<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="bg-orbs" aria-hidden="true">
  <span class="orb orb-blue"></span>
  <span class="orb orb-purple"></span>
</div>
<div class="error-page">
  <p class="error-code">404</p>
  <h1 class="error-title">This page doesn't exist</h1>
  <p class="error-text">The link might be broken, or the page may have moved.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Back to home</a>
</div>
</body>
</html>
